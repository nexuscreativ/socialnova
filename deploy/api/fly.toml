# fly.toml app configuration file generated for socialnova-api on 2026-08-11T16:19:13+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'socialnova-api'
primary_region = 'iad'

[experimental]
  auto_rollback = true

[build]
  dockerfile = '../../apps/api/Dockerfile'

[env]
  API_URL = 'http://127.0.0.1:8000'
  APP_ENV = 'production'
  APP_URL = 'https://socialnova-web.fly.dev'
  CORS_ORIGINS = '["https://socialnova-web.fly.dev","http://localhost:3000"]'
  DB_MAX_OVERFLOW = '5'
  DB_POOL_RECYCLE = '1800'
  DB_POOL_SIZE = '5'
  LOG_LEVEL = 'info'
  REDIS_URL = 'redis://127.0.0.1:6379'
  UPLOAD_DIR = '/data/uploads'
  UPLOAD_URL_PREFIX = '/uploads'
  WORKERS = '2'

[[mounts]]
  source = 'uploads'
  destination = '/data/uploads'

[[services]]
  protocol = 'tcp'
  internal_port = 8000
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

[checks]
  [checks.health]
    port = 8000
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
